<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <link rel="icon" href="assets/img/favicon/favicon.ico?v=2" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon/favicon-32.png?v=2">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/img/favicon/favicon-192.png?v=2">
  <link rel="apple-touch-icon" href="assets/img/favicon/apple-touch-icon.png?v=2">
  <title>Início - Intelbras</title>
  <meta name="color-scheme" content="light dark">
  <!-- Tema (Claro/Escuro/Automático): tem que vir antes dos CSS -->
  <script src="assets/js/tema.js?v=1"></script>
  <script src="assets/js/dialogo.js?v=1"></script>
  <script src="assets/js/responsivo.js?v=1"></script>
  <link rel="stylesheet" href="assets/css/tema-escuro.css?v=3">
  <link rel="stylesheet" href="assets/css/barra-rolagem.css?v=2">
  <!-- Anti-flash da camada de movimento: esconde o <main> até o movimento.js
       classificar a página (1ª varredura). Se algo falhar, libera em 1,5s. -->
  <script>window.__mvAguardar=[];document.documentElement.classList.add('mv-boot');setTimeout(function(){document.documentElement.classList.remove('mv-boot')},1500);</script>
  <link rel="stylesheet" href="assets/css/popout-bloqueio.css">
  <link rel="stylesheet" href="assets/css/dialogo.css?v=1">
  <link rel="stylesheet" href="assets/css/seletor.css">
  <link rel="stylesheet" href="assets/css/busca-pagina.css?v=3">
</head>
<body style="margin:0;">

  <!-- O cabeçalho é injetado aqui em tempo de execução (versão de preview estático) -->
  <div id="cabecalho-placeholder"></div>

  <main id="conteudo-placeholder">
    <!-- Conteúdo entra aqui -->
  </main>

  <!-- Rodapé entra aqui -->
  <div id="rodape-placeholder"></div>

  <script>
    // Preview estático: carrega cada bloco via fetch.
    // Quando o back-end tiver PHP, troque isso por:
    // <?php include 'cabecalho/html/cabecalho.html'; ?>, etc. (veja index.php)

    function carregarBloco(url, placeholderId, scriptSrc) {
      // A página só aparece depois que o bloco entrou E os CSS dele carregaram
      // (movimento.js espera as promessas de window.__mvAguardar).
      const pronto = fetch(url)
        .then(res => res.text())
        .then(html => {
          const alvo = document.getElementById(placeholderId);
          alvo.innerHTML = html;
          if (scriptSrc) {
            const script = document.createElement('script');
            script.src = scriptSrc;
            document.body.appendChild(script);
          }
          return Promise.all(Array.from(alvo.querySelectorAll('link[rel="stylesheet"]')).map(l => new Promise(ok => {
            if (l.sheet) return ok();
            l.addEventListener('load', ok, { once: true });
            l.addEventListener('error', ok, { once: true });
          })));
        })
        .catch(() => {});
      (window.__mvAguardar = window.__mvAguardar || []).push(pronto);
    }

    carregarBloco('cabecalho/html/cabecalho.html', 'cabecalho-placeholder', 'cabecalho/js/cabecalho.js?v=1791920002');
    carregarBloco('conteudo/nao-cadastrado/inicio/html/inicio.html', 'conteudo-placeholder', 'conteudo/nao-cadastrado/inicio/js/inicio.js?v=1788201758');
    carregarBloco('rodape/html/rodape.html', 'rodape-placeholder', null);
  </script>

  <!-- Popout global "Acesso negado" (independe de qual bloco carregou primeiro,
       pois escuta cliques no document inteiro via delegação) -->
  <script src="assets/js/popout-bloqueio.js?v=1788205181"></script>
  <script src="assets/js/seletor.js?v=2"></script>
  <!-- Busca na página (Ctrl+F) no padrão do site -->
  <script src="assets/js/busca-pagina.js?v=2"></script>

  <!-- Camada global de animação + padronização visual -->
  <link rel="stylesheet" href="assets/css/movimento.css?v=13">
  <script src="assets/js/movimento.js?v=12"></script>

  <!-- Responsivo global (celular · tablet · notebook) -->
  <link rel="stylesheet" href="assets/css/responsivo.css?v=2">

</body>
</html>
